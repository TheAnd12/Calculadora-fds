<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eee; font-family: sans-serif; }
  .calc { background: #333; padding: 15px; border-radius: 10px; }
  #visor { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 10px; box-sizing: border-box; }
  .teclas { display: grid; grid-template-columns: repeat(4, 60px); gap: 5px; }
  button { height: 60px; font-size: 20px; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { opacity: 0.8; }
  .igual { background: orange; color: white; }
</style>
</head>
<body>
  <div class="calc">
    <input id="visor" readonly>
    <div class="teclas">
      <button onclick="limpar()">C</button>
      <button onclick="apagar()">⌫</button>
      <button onclick="add('/')">/</button>
      <button onclick="add('*')">*</button>
      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add('-')">-</button>
      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="add('+')">+</button>
      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button class="igual" onclick="calcular()">=</button>
      <button onclick="add('0')" style="grid-column: span 2">0</button>
      <button onclick="add('.')">.</button>
    </div>
  </div>

<script>
  const visor = document.getElementById('visor');

  function add(valor) { visor.value += valor; }
  function limpar() { visor.value = ''; }
  function apagar() { visor.value = visor.value.slice(0, -1); }
  function calcular() {
    try { visor.value = eval(visor.value); }
    catch { visor.value = 'Erro'; }
  }
</script>
</body>
</html>
